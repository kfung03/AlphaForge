[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Quantitative research and portfolio backtesting platform"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "arch",
    "xgboost",
    "matplotlib",
    "plotly",
    "streamlit",
    "fastapi",
    "uvicorn",
    "pydantic",
    "joblib",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]